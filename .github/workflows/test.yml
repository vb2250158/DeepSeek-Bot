name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test result
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DSH_HARNESS: ${{ github.workspace }}/core
      DSH_CORE_SHA: 3ff2154e44fcec3b98e1c529ae9f62b26b20096c
      DSH_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          architecture: x64
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - name: Pin npm
        run: npm install --global npm@11.12.1
      - name: Enable Core source paths on Windows
        run: git config --global core.longpaths true
      - name: Check out the tested Core source
        uses: actions/checkout@v4
        with:
          repository: vb2250158/deepseek-harness
          ref: 3ff2154e44fcec3b98e1c529ae9f62b26b20096c
          path: core
      - name: Verify the target environment
        run: |
          node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 is required' }
          if ((node --version) -ne 'v24.15.0') { throw 'Unexpected Node version' }
          if ((npm --version) -ne '11.12.1') { throw 'Unexpected npm version' }
          if ((pnpm --version) -ne '11.28.5') { throw 'Unexpected pnpm version' }
          if ((git -C core rev-parse HEAD) -ne $env:DSH_CORE_SHA) { throw 'Unexpected Core commit' }
          node -e "if (require('./core/package.json').version !== '0.2.2-alpha.3') process.exit(1)"
      - name: Install Core source dependencies
        working-directory: core
        run: pnpm install --frozen-lockfile
      - name: Build the Host native addon
        working-directory: core
        run: pnpm run build:native-system
      - name: Build Host libraries
        working-directory: core
        run: pnpm exec tsx scripts/compile-referenced-projects.ts host-libraries
      - name: Build Client libraries
        working-directory: core
        run: pnpm run build:lib:client
      - name: Build Web assets
        working-directory: core
        run: pnpm run build:web
      - name: Install plugin tools
        working-directory: ds-bot
        run: npm ci --no-fund --no-audit
      - name: Current behavior and saved-data regressions
        working-directory: ds-bot
        run: npm test -- --test-concurrency=4 --test-reporter=tap
      - name: Check generated plugin artifacts
        working-directory: ds-bot
        run: node scripts/build-client.mjs --check
      - name: Lint
        working-directory: ds-bot
        run: npm run lint
      - name: Source Host Web smoke
        working-directory: ds-bot
        run: node dev/ci-web-smoke.mjs
      - name: Scan the published tree
        env:
          SCAN_EXTRA_PATTERNS: ${{ secrets.SCAN_EXTRA_PATTERNS }}
        run: |
          $tree = Join-Path $env:RUNNER_TEMP 'dsbot-published-tree'
          $archive = Join-Path $env:RUNNER_TEMP 'dsbot-published-tree.tar'
          New-Item -ItemType Directory -Path $tree | Out-Null
          git archive --format=tar --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot archive the published tree' }
          tar -xf $archive -C $tree
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract the published tree' }
          node scripts/scan.mjs $tree
